# ==========================================
# PARAMETROS VARIABLES (nunca en el codigo ni en los prompts)
# Se importa desde application.properties con spring.config.import.
# Cualquier valor se puede sobrescribir con una variable de entorno
# (ej. APP_RATE_LIMIT_LLM_LIMIT=20, LEGAL_ART71_MINIMUM_FINE=130.00).
# ==========================================

# --- Limite de peticiones por IP (sliding window en Redis) ---
app.rate-limit.enabled=true
app.rate-limit.window-seconds=60
app.rate-limit.llm-limit=10
app.rate-limit.general-limit=60
app.rate-limit.llm-paths=/api/v1/claims/**
app.rate-limit.excluded-paths=/actuator/**,/health

# --- Parametros legales (LODC) ---
# Art. 71, ultimo inciso: la multa no puede ser inferior a este valor (USD)
legal.art71.minimum-fine=120.00
