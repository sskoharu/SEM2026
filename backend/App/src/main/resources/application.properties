# ==========================================
# 1. CONFIGURACION DEL SERVIDOR WEB
# ==========================================
server.port=8080
spring.application.name=backend-defensa-consumidor
spring.config.import=optional:file:config/parametros.yaml,optional:file:../../config/parametros.yaml

# ==========================================
# 2. CONFIGURACION DE SPRING AI - GEMINI (VIA OPENAI CLIENT)
# ==========================================
# URL base para redirigir las peticiones de OpenAI hacia Gemini
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai

# Clave de API de Gemini (obtenida de Google AI Studio)
spring.ai.openai.api-key=${LLM_API_KEY}

# Configuración del modelo LLM (Chat)
spring.ai.openai.chat.options.model=gemini-3.5-flash-lite
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.max-tokens=2048

# Modelo de Embeddings
spring.ai.openai.embedding.options.model=gemini-embedding-001
spring.ai.openai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# 4. Configuración de la base de datos vectorial Qdrant
spring.ai.vectorstore.qdrant.host=2f6d4e2b-1d57-4b4c-b16b-b521e8bdf05d.us-east-1-1.aws.cloud.qdrant.io
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}
spring.ai.vectorstore.qdrant.collection-name=lodc_leyes_vector
spring.ai.vectorstore.qdrant.initialize-schema=true

# ==========================================
# 3. GESTION DE TIEMPOS Y LIMITES (REINTENTOS)
# ==========================================
# Numero maximo de intentos totales para errores transitorios del proveedor
spring.ai.retry.max-attempts=2

# Backoff exponencial: espera inicial de 2 segundos, multiplica por 2 cada vez
spring.ai.retry.backoff.initial-interval=2000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000ms

# No reintentar errores de cliente como 400, 401 (reintentar es inutil)
spring.ai.retry.exclude-on-http-codes=400,401,403,404

# Asegurar que 429 y errores de servidor esten en la lista de reintentos
spring.ai.retry.on-http-codes=429,500,502,503,504

# ==========================================
# 4. CONFIGURACION DE LOGS Y OBSERVABILIDAD
# ==========================================
# Monitoreo basico de peticiones sin exponer informacion personal (PII)
logging.level.org.springframework.web=INFO
logging.level.org.springframework.ai=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


#REDIS
# La URL suele tener el formato: rediss://default:tu_password@tu_host:puerto
spring.data.redis.host=sesiones-juridicas-fond-maple.sage.cloud.layerbase.dev
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
# Vital para la nube: habilitar SSL (TLS)
spring.data.redis.ssl.enabled=true