# ==========================================
# 1. CONFIGURACION DEL SERVIDOR WEB
# ==========================================
server.port=${PORT:8080}
# Resuelve la IP real del cliente tras el proxy de Render (X-Forwarded-For, solo proxies internos de confianza)
server.forward-headers-strategy=native

# ==========================================
# PARAMETROS VARIABLES: rate limit y parametros legales (config/parametros-legales.properties)
# ==========================================
spring.config.import=classpath:config/parametros-legales.properties
spring.application.name=backend-defensa-consumidor

# ==========================================
# 2. CONFIGURACION DE SPRING AI - OPENAI
# ==========================================
# Clave de API de OpenAI (variable de entorno LLM_API_KEY)
spring.ai.openai.api-key=${LLM_API_KEY}

# Configuracion del modelo LLM (Chat). Los modelos GPT-5 usan max-completion-tokens
# y no admiten temperature distinta de la por defecto.
spring.ai.openai.chat.options.model=gpt-5.6-sol
spring.ai.openai.chat.options.max-completion-tokens=8192
# El razonamiento interno consume tokens de salida; con un tope bajo la respuesta llega vacia
spring.ai.openai.chat.options.reasoning-effort=none

# Modelo de Embeddings (3072 dimensiones). Si se cambia, borrar las colecciones de Qdrant y reingestar.
spring.ai.openai.embedding.options.model=text-embedding-3-large

# 4. Configuracion de la base de datos vectorial Qdrant
spring.ai.vectorstore.qdrant.host=2f6d4e2b-1d57-4b4c-b16b-b521e8bdf05d.us-east-1-1.aws.cloud.qdrant.io
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY}
spring.ai.vectorstore.qdrant.collection-name=lodc_leyes_vector
spring.ai.vectorstore.qdrant.initialize-schema=true

# ==========================================
# 3. GESTION DE TIEMPOS Y LIMITES (REINTENTOS)
# ==========================================
# Numero maximo de reintentos
spring.ai.retry.max-attempts=4

# Backoff exponencial: espera inicial de 2 segundos, multiplica por 2 cada vez
spring.ai.retry.backoff.initial-interval=2000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000ms

# No reintentar errores de cliente como 400, 401 (reintentar es inutil)
spring.ai.retry.exclude-on-http-codes=400,401,403,404

# Asegurar que 429 y errores de servidor esten en la lista de reintentos
spring.ai.retry.on-http-codes=429,500,502,503,504

# ==========================================
# 4. CONFIGURACION DE LOGS Y OBSERVABILIDAD
# ==========================================
# Monitoreo basico de peticiones sin exponer informacion personal (PII)
logging.level.org.springframework.web=INFO
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


#REDIS
# La URL suele tener el formato: rediss://default:tu_password@tu_host:puerto
spring.data.redis.host=sesiones-juridicas-fair-mold.sage.cloud.layerbase.dev
spring.data.redis.username=default
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
# Vital para la nube: habilitar SSL (TLS)
spring.data.redis.ssl.enabled=true

#INGESTA
app.ingestion.enabled=false
app.dpe.collection-name=dpe_orientacion

# ACTUATOR
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

#BDD POSTGRESQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# La app arranca aunque la BD no esté disponible; la tabla claim_case se crea en el primer uso
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
# Abstencion: score minimo de similitud del mejor fragmento (calibrar con los 20 casos)
app.rag.abstention-threshold=${APP_RAG_ABSTENTION_THRESHOLD:0.40}

# Agente Capa 4: maximo de herramientas ejecutadas por solicitud
app.agent.max-tool-steps=${APP_AGENT_MAX_TOOL_STEPS:5}
