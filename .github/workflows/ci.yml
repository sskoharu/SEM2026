name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: bash ./mvnw -B clean verify

      - name: Upload verified backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/App/target/Backend_Artifact-1.0-SNAPSHOT.jar
          retention-days: 3

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend and proxy
        run: npm run lint

      - name: Run frontend server proxy tests
        run: node --test tests/server/proxy.test.mjs

      - name: Build frontend
        run: npm run build

      - name: Validate evaluation aggregation
        run: node --test ../eval/evaluador.test.mjs
